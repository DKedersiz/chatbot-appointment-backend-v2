spring.application.name=appointment
spring.datasource.url=jdbc:h2://mem:db;DB_CLOSE_DELAY=-1
spring.jpa.properties.hibernate.default_schema = appointment_v2
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql = true

JWT_SECRET_KEY = cc
JWT_EXPIRATION = 86400000
JWT_REFRESH_TOKEN_EXPIRATION = 172800000

app_base_url = https://localhost:3000
logging.level.org.springframework.security=DEBUG

spring.mail.host= smtp.gmail.com
spring.mail.port=587
spring.mail.username=bb
spring.mail.password=aa
spring.mail.properties.mail.smtp.auth = true
spring.mail.properties.mail.smtp.starttls.enable = true
